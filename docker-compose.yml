# Local dependencies: `docker compose up -d`, then `mvn spring-boot:run -Dspring-boot.run.profiles=seed`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # SMTP test server: the app sends to port 1025, emails are visible at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
