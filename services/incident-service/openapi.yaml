openapi: 3.1.0
info:
  title: Incident service
  description: |-
    Report incidents, list them, and work them: rename, describe, escalate or de-escalate (severity, with emails), and move them through the lifecycle. The history is served by audit-service (port 8083), the teams by organization-service (port 8081).

    **Caller:** every request names the acting user in the `X-User-Id` header, as a username (demo users `ada`, `alice`, `bob`, `carol`, `dan`, `erin`) or a user id. Click **Authorize** and enter e.g. `dan`.

    **Idempotency-Key:** optional on `POST` and `PATCH`; a repeat with the same key and body returns the first response instead of changing the incident again (kept 24 hours).

    **Demo data:** incidents `40000000-0000-0000-0000-000000000001` (OPEN), `…0002` (IN_PROGRESS), `…0003` (RESOLVED); teams Platform `10000000-0000-0000-0000-000000000001`, Database `…0002`, Network `…0003`; categories Payments `30000000-0000-0000-0000-000000000001`, Web application `…0002`, Database `…0003`, VPN `…0004`, Network `…0005`.

    **Errors** are RFC 9457 problem details (`application/problem+json`).
  version: "1"
servers:
- url: /
  description: This service
- url: http://localhost:8082
  description: "Local, default port"
tags:
- name: Incidents
  description: "List, create, update (name, description, severity, status), comment"
paths:
  /incidents:
    get:
      tags:
      - Incidents
      summary: List all incidents
      description: "Every incident in any status, newest first."
      operationId: listAllIncidents
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentSummary"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
    post:
      tags:
      - Incidents
      summary: Create an incident
      description: "Any active user. The category decides the owning team, whose members\
        \ are emailed. The new incident is `OPEN`. A reporter may set at most `SEV2`\
        \ (409 otherwise); `title` (≤ 200), `categoryId` and `severity` are required,\
        \ `description` (≤ 5000) is optional."
      operationId: createIncident
      parameters:
      - name: Idempotency-Key
        in: header
        description: "Optional, ≤ 100 characters, e.g. a UUID per user action. A repeat\
          \ with the same key and body within 24 h returns the first response without\
          \ changing anything again; the same key with another body is 409"
        required: false
        schema:
          type: string
        example: 3f2b8c1e-5d4a-4e6f-9a7b-1c2d3e4f5a6b
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIncidentCommand"
            examples:
              Database incident:
                description: Database incident
                value:
                  title: Checkout is slow
                  description: Pages take 10 s to load
                  categoryId: 30000000-0000-0000-0000-000000000003
                  severity: SEV2
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentView"
        "400":
          description: "Invalid input, e.g. malformed id or JSON, missing value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business rule violated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
  /incidents/{incidentId}/comments:
    post:
      tags:
      - Incidents
      summary: Comment on an incident
      description: "Owning team or reporter, while the incident is `OPEN`, `IN_PROGRESS`\
        \ or `IN_REVIEW`. `text` ≤ 5000."
      operationId: addComment
      parameters:
      - name: incidentId
        in: path
        description: "Incident id; demo data: `40000000-0000-0000-0000-000000000001`\
          \ (OPEN, Database team), `…0002` (IN_PROGRESS, Network), `…0003` (RESOLVED,\
          \ Platform)"
        required: true
        schema:
          type: string
          format: uuid
        example: 40000000-0000-0000-0000-000000000001
      - name: Idempotency-Key
        in: header
        description: "Optional, ≤ 100 characters, e.g. a UUID per user action. A repeat\
          \ with the same key and body within 24 h returns the first response without\
          \ changing anything again; the same key with another body is 409"
        required: false
        schema:
          type: string
        example: 3f2b8c1e-5d4a-4e6f-9a7b-1c2d3e4f5a6b
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCommentCommand"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentView"
        "400":
          description: "Invalid input, e.g. malformed id or JSON, missing value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Not allowed, e.g. not a member of the owning team"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business rule violated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
  /incidents/{incidentId}:
    get:
      tags:
      - Incidents
      summary: View an incident
      description: "With its comments, oldest first."
      operationId: getIncident
      parameters:
      - name: incidentId
        in: path
        description: "Incident id; demo data: `40000000-0000-0000-0000-000000000001`\
          \ (OPEN, Database team), `…0002` (IN_PROGRESS, Network), `…0003` (RESOLVED,\
          \ Platform)"
        required: true
        schema:
          type: string
          format: uuid
        example: 40000000-0000-0000-0000-000000000001
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentView"
        "400":
          description: "Invalid input, e.g. malformed id or JSON, missing value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
    patch:
      tags:
      - Incidents
      summary: "Update an incident: name, description, severity, status"
      description: |-
        Fields left out stay unchanged; at least one change is needed. Applied in this order, all or nothing:

        1. **title / description** — owning team or reporter; no emails.
        2. **severity** + **reason** — owning team. Higher = **escalation**, optionally handing the incident over to `targetTeamId` (it becomes `OPEN` for that team); lower = **de-escalation**, same team (`targetTeamId` → 409). Both are recorded and emailed to the owning team, the previous team (on hand-over) and the reporter.
        3. **status** — owning team: `OPEN → IN_PROGRESS → IN_REVIEW → RESOLVED → CLOSED`, `IN_REVIEW → IN_PROGRESS`, `RESOLVED → IN_PROGRESS` (reopen), `OPEN | IN_PROGRESS | IN_REVIEW → CANCELLED`. **reason** is required to resolve, cancel or reopen. Emails: acknowledged → reporter; resolved, reopened, cancelled → team and reporter.
      operationId: updateIncident
      parameters:
      - name: incidentId
        in: path
        description: "Incident id; demo data: `40000000-0000-0000-0000-000000000001`\
          \ (OPEN, Database team), `…0002` (IN_PROGRESS, Network), `…0003` (RESOLVED,\
          \ Platform)"
        required: true
        schema:
          type: string
          format: uuid
        example: 40000000-0000-0000-0000-000000000001
      - name: Idempotency-Key
        in: header
        description: "Optional, ≤ 100 characters, e.g. a UUID per user action. A repeat\
          \ with the same key and body within 24 h returns the first response without\
          \ changing anything again; the same key with another body is 409"
        required: false
        schema:
          type: string
        example: 3f2b8c1e-5d4a-4e6f-9a7b-1c2d3e4f5a6b
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIncidentCommand"
            examples:
              Rename:
                description: Rename
                value:
                  title: Primary DB slow
              Describe:
                description: Describe
                value:
                  description: Timeouts on checkout and login
              Acknowledge:
                description: Acknowledge
                value:
                  status: IN_PROGRESS
              Escalate:
                description: Escalate
                value:
                  severity: SEV1
                  reason: replica lag growing
              Escalate and hand over:
                description: Escalate and hand over
                value:
                  severity: SEV1
                  targetTeamId: 10000000-0000-0000-0000-000000000001
                  reason: connection pool of the payments service
              De-escalate:
                description: De-escalate
                value:
                  severity: SEV3
                  reason: contained
              Submit for review:
                description: Submit for review
                value:
                  status: IN_REVIEW
              Resolve:
                description: Resolve
                value:
                  status: RESOLVED
                  reason: index rebuilt
              Close:
                description: Close
                value:
                  status: CLOSED
              Cancel:
                description: Cancel
                value:
                  status: CANCELLED
                  reason: duplicate
              Several at once:
                description: Several at once
                value:
                  title: Primary DB rejects writes
                  severity: SEV1
                  status: IN_PROGRESS
                  reason: disk full
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IncidentView"
        "400":
          description: "Invalid input, e.g. malformed id or JSON, missing value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "Not allowed, e.g. not a member of the owning team"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business rule violated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
  /users/{user}/incidents:
    get:
      tags:
      - Incidents
      summary: List incidents reported by a user
      description: Newest first. 404 if no such user.
      operationId: listUserIncidents
      parameters:
      - name: user
        in: path
        description: Username or user id
        required: true
        schema:
          type: string
        example: bob
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentSummary"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
  /teams/{teamId}/incidents:
    get:
      tags:
      - Incidents
      summary: List a team's incidents
      description: "Incidents the team owns now, in any status, newest first. 404\
        \ if the team does not exist."
      operationId: listTeamIncidents
      parameters:
      - name: teamId
        in: path
        description: Team id
        required: true
        schema:
          type: string
          format: uuid
        example: 10000000-0000-0000-0000-000000000002
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentSummary"
        "400":
          description: "Invalid input, e.g. malformed id or JSON, missing value"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Header missing, or the user is unknown, deactivated or the\
            \ system user"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "A service this one depends on is unavailable, retry"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - caller: []
components:
  schemas:
    ReportIncidentCommand:
      type: object
      description: Body of POST /incidents
      properties:
        title:
          type: string
          description: Short name (≤ 200)
          example: Checkout is slow
        description:
          type: string
          description: "Free text (≤ 5000); optional, blank means none"
          example: Pages take 10 s to load
        categoryId:
          type: string
          format: uuid
          description: "An active category; it decides the owning team. Demo data:\
            \ Payments `30000000-0000-0000-0000-000000000001`, Web application `…\
            0002`, Database `…0003`, VPN `…0004`, Network `…0005`"
          example: 30000000-0000-0000-0000-000000000003
        severity:
          type: string
          description: How bad it is; a reporter may set at most SEV2 (SEV1 → 409)
          enum:
          - SEV1
          - SEV2
          - SEV3
          - SEV4
          example: SEV2
      required:
      - categoryId
      - severity
      - title
    CommentView:
      type: object
      description: A comment on an incident
      properties:
        id:
          type: string
          format: uuid
          description: Comment id
          example: 50000000-0000-0000-0000-000000000001
        incidentId:
          type: string
          format: uuid
          description: Incident it belongs to
          example: 40000000-0000-0000-0000-000000000001
        authorId:
          type: string
          format: uuid
          description: "User who wrote it: a member of the owning team or the reporter"
          example: 20000000-0000-0000-0000-000000000003
        text:
          type: string
          description: Text (≤ 5000); comments are never edited or deleted
          example: Also affects the mobile app
        createdAt:
          type: string
          format: date-time
          description: When it was written (UTC)
          example: 2026-10-02T09:05:00Z
    IncidentView:
      type: object
      description: An incident with all its fields and comments
      properties:
        id:
          type: string
          format: uuid
          description: Incident id
          example: 40000000-0000-0000-0000-000000000001
        title:
          type: string
          description: Short name (≤ 200)
          example: Checkout is slow
        description:
          type: string
          description: Free text (≤ 5000); empty string if none was given
          example: Pages take 10 s to load
        categoryId:
          type: string
          format: uuid
          description: Category the reporter chose; it decided the first owning team
          example: 30000000-0000-0000-0000-000000000003
        categoryName:
          type: string
          description: Category name at the time of reporting (snapshot)
          example: Database
        teamId:
          type: string
          format: uuid
          description: Team that owns the incident now; changes only by an escalation
            with hand-over
          example: 10000000-0000-0000-0000-000000000002
        reporterId:
          type: string
          format: uuid
          description: User who reported it
          example: 20000000-0000-0000-0000-000000000003
        severity:
          type: string
          description: Current severity
          enum:
          - SEV1
          - SEV2
          - SEV3
          - SEV4
          example: SEV2
        status:
          type: string
          description: Current lifecycle status
          enum:
          - OPEN
          - IN_PROGRESS
          - IN_REVIEW
          - RESOLVED
          - CLOSED
          - CANCELLED
          example: OPEN
        createdAt:
          type: string
          format: date-time
          description: When it was reported (UTC)
          example: 2026-10-02T09:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Last change of any field or a new comment (UTC)
          example: 2026-10-02T09:05:00Z
        acknowledgedAt:
          type: string
          format: date-time
          description: When the owning team first moved it to IN_PROGRESS; cleared
            on hand-over to another team
        resolvedAt:
          type: string
          format: date-time
          description: When it was resolved; cleared when reopened
        resolvedBy:
          type: string
          format: uuid
          description: User who resolved it; cleared when reopened
        resolutionNote:
          type: string
          description: Reason given when resolving (≤ 2000); cleared when reopened
        closedAt:
          type: string
          format: date-time
          description: When it was closed or cancelled
        comments:
          type: array
          description: "Comments, oldest first"
          items:
            $ref: "#/components/schemas/CommentView"
    AddCommentCommand:
      type: object
      description: "Body of POST /incidents/{id}/comments"
      properties:
        text:
          type: string
          description: "Comment text (≤ 5000); by the owning team or the reporter,\
            \ while the incident is OPEN, IN_PROGRESS or IN_REVIEW"
          example: Also affects the mobile app
      required:
      - text
    UpdateIncidentCommand:
      type: object
      description: "Body of PATCH /incidents/{id}: fields left out stay unchanged;\
        \ at least one change is needed"
      properties:
        title:
          type: string
          description: New name (≤ 200). Owning team or reporter
          example: Primary DB slow
        description:
          type: string
          description: New description (≤ 5000); blank clears it. Owning team or reporter
          example: Timeouts on checkout and login
        severity:
          type: string
          description: "Owning team only. Higher than now = escalation (may hand over\
            \ with targetTeamId), lower = de-escalation (same team); both need reason\
            \ and are emailed"
          enum:
          - SEV1
          - SEV2
          - SEV3
          - SEV4
          example: SEV1
        targetTeamId:
          type: string
          format: uuid
          description: "Only with an escalation: hand the incident over to this active\
            \ team; it becomes OPEN for that team. Demo data: Platform `10000000-0000-0000-0000-000000000001`,\
            \ Database `…0002`, Network `…0003`"
          example: 10000000-0000-0000-0000-000000000001
        status:
          type: string
          description: "Owning team only: the next lifecycle step, see IncidentStatus.\
            \ Resolving, cancelling and reopening need reason"
          enum:
          - OPEN
          - IN_PROGRESS
          - IN_REVIEW
          - RESOLVED
          - CLOSED
          - CANCELLED
          example: IN_PROGRESS
        reason:
          type: string
          description: "Required with severity, and to resolve, cancel or reopen (≤\
            \ 2000); shown in emails and in the history"
          example: replica lag growing
    IncidentSummary:
      type: object
      description: "One line of an incident list, newest first"
      properties:
        id:
          type: string
          format: uuid
          description: Incident id
          example: 40000000-0000-0000-0000-000000000001
        title:
          type: string
          description: Short name
          example: Checkout is slow
        teamId:
          type: string
          format: uuid
          description: Owning team
          example: 10000000-0000-0000-0000-000000000002
        reporterId:
          type: string
          format: uuid
          description: User who reported it
          example: 20000000-0000-0000-0000-000000000003
        severity:
          type: string
          description: Current severity
          enum:
          - SEV1
          - SEV2
          - SEV3
          - SEV4
          example: SEV2
        status:
          type: string
          description: Current lifecycle status
          enum:
          - OPEN
          - IN_PROGRESS
          - IN_REVIEW
          - RESOLVED
          - CLOSED
          - CANCELLED
          example: OPEN
        createdAt:
          type: string
          format: date-time
          description: When it was reported (UTC)
          example: 2026-10-02T09:00:00Z
    Problem:
      type: object
      description: "RFC 9457 problem detail, the body of every error response"
      properties:
        type:
          type: string
          description: "Problem type; always about:blank, the status says it all"
          example: about:blank
        title:
          type: string
          description: Reason phrase of the status code
          example: Not Found
        status:
          type: integer
          format: int32
          description: "HTTP status code: 400 invalid input, 401 unknown or inactive\
            \ caller, 403 not allowed, 404 not found, 409 business rule violated,\
            \ 503 a service this one depends on is unavailable"
          example: 404
        detail:
          type: string
          description: "What went wrong, for a human"
          example: Incident 40000000-0000-0000-0000-000000000009 not found
        instance:
          type: string
          description: Path of the request
          example: /incidents/40000000-0000-0000-0000-000000000009
  securitySchemes:
    caller:
      type: apiKey
      description: Username (e.g. `bob`) or user id of the acting user
      name: X-User-Id
      in: header
