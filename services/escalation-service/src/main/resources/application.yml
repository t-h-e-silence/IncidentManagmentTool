logging:
  level:
    # DEBUG shows repeated events that were skipped and how many commands each relay run published.
    escalations.service: DEBUG

spring:
  application:
    name: escalation-service
  main:
    # No HTTP API (ADR D1): nothing listens on a port.
    web-application-type: none
  datasource:
    # Own database (ADR D5); services/docker-compose.yml publishes Postgres on 5434.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/escalations}
    username: ${DB_USER:escalations}
    password: ${DB_PASSWORD:escalations}
  jpa:
    open-in-view: false
    hibernate:
      # Schemas are owned by Flyway; Hibernate only checks that entities match them.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    schemas: escalations
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # Own RabbitMQ user: may read only its own queue and write only to its own exchange (ADR D14,
    # services/rabbitmq/definitions.json).
    username: ${RABBITMQ_USER:escalation-service}
    password: ${RABBITMQ_PASSWORD:escalation-service}
    virtual-host: incident-management
    # An outbox row is marked published only after RabbitMQ's ack.
    publisher-confirm-type: correlated
    listener:
      simple:
        # Ack after the listener's transaction commits; a rejected message is dead-lettered, not requeued.
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: 1
        max-concurrency: 1
        prefetch: 10
        # 1 attempt + 3 retries after 1 s, 5 s and 25 s, then the dead-letter queue (ADR D8).
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 5
          max-interval: 25s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short, so a Redis outage only slows things down a little before organization-service is asked directly.
      timeout: 500ms
      connect-timeout: 500ms
  http:
    client:
      # Calls to organization-service.
      connect-timeout: 2s
      read-timeout: 5s

organization:
  url: ${ORGANIZATION_URL:http://localhost:8081}
  # How long organization answers are cached in Redis (ADR D6).
  cache-ttl: 5m

outbox:
  relay:
    interval: 1s
    batch-size: 100
    confirm-timeout: 10s
